name: Build student handouts

on:
  push:
    branches: [main]
    paths:
      - 'course/notion/**'
      - 'course/quiz/**'
      - 'course/course.yml'
      - 'course/hub.yml'
      - 'course/readme-template.md'
      - 'course/python-basics.md'
      - 'course/assets/**'
      - 'notebooks/student/**'
      - 'scripts/build_course_hub.py'
      - 'scripts/build_handouts.py'
      - 'scripts/check_public_release.py'
      - 'scripts/requirements-handouts.txt'
      - '.github/workflows/handouts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: student-handouts-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-handouts.txt
      - name: Use Ubuntu HTTPS mirror with bounded retries
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/80-course-timeouts
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python scripts/build_handouts.py
      - run: python scripts/check_public_release.py course
      - run: python scripts/check_public_release.py README.md
      - name: Upload handouts to the repository
        # Keep reviewed authoring PDFs stable; publish regeneration only to students.
        if: github.repository == 'lunalab-ai/recommender'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- course/handouts README.md course/references.md
          if ! git diff --cached --quiet; then
            git commit -m "Update course hub, references and student handouts"
            git push origin HEAD:main
          fi
