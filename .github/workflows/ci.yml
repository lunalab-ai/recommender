name: course-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,apps]"
      - name: Install browser for authoring math and Notion tests
        if: ${{ hashFiles('scripts/build_notebooks.py') != '' }}
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - run: python -m pytest -q
      - name: Build notebooks when authoring sources are present
        if: ${{ hashFiles('scripts/build_notebooks.py') != '' && hashFiles('notebooks/source/*.py') != '' }}
        run: python scripts/build_notebooks.py
      - name: Validate Notion source when validator is present
        if: ${{ hashFiles('scripts/validate_notion_bundle.py') != '' && hashFiles('course/notion/**/*.md') != '' }}
        run: python scripts/validate_notion_bundle.py course/notion --strict
      - name: Execute all student lessons from fresh kernels
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          for notebook in sorted(Path('notebooks/student').glob('*.ipynb')):
              if notebook.name.startswith('w00-'):
                  continue
              subprocess.run([sys.executable, 'scripts/verify_notebook.py', str(notebook), '--require-checks'], check=True)
          PY
