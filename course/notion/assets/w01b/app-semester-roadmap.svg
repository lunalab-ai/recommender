<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">학기 동안 발전하는 추천 앱</title><desc id="desc">첫 GUI와 baseline에서 시작해 내용 기반, 협업 필터링, 행렬분해, 딥러닝과 설명 가능한 추천으로 발전하는 로드맵</desc>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#40556d"/></marker><style>.t{font:700 30px Arial,'Noto Sans KR',sans-serif;fill:#173450}.h{font:700 19px Arial,'Noto Sans KR',sans-serif;fill:#173450}.b{font:16px Arial,'Noto Sans KR',sans-serif;fill:#29445f}.a{stroke:#40556d;stroke-width:4;fill:none;marker-end:url(#m)}</style></defs>
  <rect width="1200" height="500" fill="#fbfcfe"/><text x="600" y="48" text-anchor="middle" class="t">오늘 만든 앱을 한 학기 동안 키웁니다</text>
  <path d="M120 250H1080" class="a"/>
  <g transform="translate(105 0)"><circle cx="0" cy="250" r="55" fill="#eaf8f1" stroke="#4d9b76" stroke-width="4"/><text x="0" y="243" text-anchor="middle" class="h">W01B</text><text x="0" y="268" text-anchor="middle" class="b">GUI 뼈대</text><text x="0" y="340" text-anchor="middle" class="h">평균 평점</text><text x="0" y="366" text-anchor="middle" class="b">첫 실행과 데이터 연결</text></g>
  <g transform="translate(345 0)"><circle cx="0" cy="250" r="48" fill="#eef4ff" stroke="#809fc2" stroke-width="3"/><text x="0" y="245" text-anchor="middle" class="h">W02</text><text x="0" y="270" text-anchor="middle" class="b">기본 추천</text><text x="0" y="340" text-anchor="middle" class="h">내용 기반</text><text x="0" y="366" text-anchor="middle" class="b">아이템 특성 반영</text></g>
  <g transform="translate(585 0)"><circle cx="0" cy="250" r="48" fill="#eef4ff" stroke="#809fc2" stroke-width="3"/><text x="0" y="245" text-anchor="middle" class="h">W03–5</text><text x="0" y="270" text-anchor="middle" class="b">CF·평가</text><text x="0" y="340" text-anchor="middle" class="h">개인화</text><text x="0" y="366" text-anchor="middle" class="b">사용자별 결과 비교</text></g>
  <g transform="translate(825 0)"><circle cx="0" cy="250" r="48" fill="#f3efff" stroke="#9b89c7" stroke-width="3"/><text x="0" y="245" text-anchor="middle" class="h">W06–10</text><text x="0" y="270" text-anchor="middle" class="b">MF·DL</text><text x="0" y="340" text-anchor="middle" class="h">학습 모델</text><text x="0" y="366" text-anchor="middle" class="b">잠재요인과 embedding</text></g>
  <g transform="translate(1065 0)"><circle cx="0" cy="250" r="48" fill="#fff5e6" stroke="#d5a95f" stroke-width="3"/><text x="0" y="245" text-anchor="middle" class="h">W11–14</text><text x="0" y="270" text-anchor="middle" class="b">AE·LLM</text><text x="0" y="340" text-anchor="middle" class="h">설명·확장</text><text x="0" y="366" text-anchor="middle" class="b">새 기능과 실제 이슈</text></g>
  <text x="600" y="455" text-anchor="middle" class="b">화면 전체를 다시 만들기보다 데이터와 추천 함수를 단계적으로 향상시킵니다.</text>
</svg>
