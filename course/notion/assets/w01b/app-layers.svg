<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">첫 추천 앱의 네 계층</title><desc id="desc">MovieLens 파일에서 데이터 로더, 추천 함수, callback, Gradio GUI로 이어지고 결과표가 사용자에게 돌아오는 구조</desc>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#40556d"/></marker><style>.t{font:700 30px Arial,'Noto Sans KR',sans-serif;fill:#173450}.h{font:700 21px Arial,'Noto Sans KR',sans-serif;fill:#173450}.b{font:17px Arial,'Noto Sans KR',sans-serif;fill:#29445f}.s{font:15px Arial,'Noto Sans KR',sans-serif;fill:#52677c}.a{stroke:#40556d;stroke-width:4;fill:none;marker-end:url(#ar)}</style></defs>
  <rect width="1200" height="520" fill="#fbfcfe"/><text x="600" y="48" text-anchor="middle" class="t">GUI는 유지하고 추천 로직은 교체할 수 있습니다</text>
  <g><rect x="45" y="130" width="230" height="220" rx="22" fill="#fff5e6" stroke="#d5a95f" stroke-width="2"/><text x="160" y="175" text-anchor="middle" class="h">① Data</text><text x="160" y="220" text-anchor="middle" class="b">u.user</text><text x="160" y="250" text-anchor="middle" class="b">u.item</text><text x="160" y="280" text-anchor="middle" class="b">u.data</text><text x="160" y="320" text-anchor="middle" class="s">DataFrame으로 읽기</text></g>
  <g><rect x="345" y="130" width="230" height="220" rx="22" fill="#eaf8f1" stroke="#64a785" stroke-width="2"/><text x="460" y="175" text-anchor="middle" class="h">② Ranking</text><text x="460" y="220" text-anchor="middle" class="b">장르 filter</text><text x="460" y="250" text-anchor="middle" class="b">평균·개수 집계</text><text x="460" y="280" text-anchor="middle" class="b">Top-N 정렬</text><text x="460" y="320" text-anchor="middle" class="s">오늘 바꾸어 볼 핵심 함수</text></g>
  <g><rect x="645" y="130" width="230" height="220" rx="22" fill="#eef4ff" stroke="#809fc2" stroke-width="2"/><text x="760" y="175" text-anchor="middle" class="h">③ Callback</text><text x="760" y="220" text-anchor="middle" class="b">GUI 입력 받기</text><text x="760" y="250" text-anchor="middle" class="b">ranking 호출</text><text x="760" y="280" text-anchor="middle" class="b">표 반환</text><text x="760" y="320" text-anchor="middle" class="s">Python과 화면의 연결점</text></g>
  <g><rect x="945" y="130" width="230" height="220" rx="22" fill="#f3efff" stroke="#9b89c7" stroke-width="2"/><text x="1060" y="175" text-anchor="middle" class="h">④ Gradio GUI</text><text x="1060" y="220" text-anchor="middle" class="b">Dropdown · Slider</text><text x="1060" y="250" text-anchor="middle" class="b">Button event</text><text x="1060" y="280" text-anchor="middle" class="b">Dataframe output</text><text x="1060" y="320" text-anchor="middle" class="s">학생이 보는 화면</text></g>
  <path d="M280 240H340" class="a"/><path d="M580 240H640" class="a"/><path d="M880 240H940" class="a"/>
  <path d="M1060 355C1060 440 760 455 760 355" class="a"/><text x="920" y="445" text-anchor="middle" class="b">입력 event → callback → 새 결과표</text>
  <text x="600" y="490" text-anchor="middle" class="b">오류가 나면 네 계층 중 어디까지 정상인지 차례로 확인합니다.</text>
</svg>
