<head>
<meta charset="utf-8">

<title>소소상점 · 추천시스템 실습</title>
<style>
:root{--ink:#291f23;--wine:#71374e;--muted:#61535a;--line:#ded2cb;--paper:#fcf7f1;--white:#fffdfa;--tint:#f4e9e9}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
button,input,select{font:inherit} button,select{cursor:pointer} button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9b4260;outline-offset:2px}
header{background:var(--white);border-bottom:2px solid var(--wine)} .bar{max-width:1240px;margin:auto;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px}
.brand{font-size:27px;letter-spacing:-.065em;font-weight:800}.nav{display:flex;gap:8px} button{border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);padding:8px 13px}.nav button{border:0;background:transparent}.nav button[aria-pressed=true]{color:var(--wine);box-shadow:inset 0 -2px var(--wine)}
.primary,button[aria-pressed=true].category{background:var(--wine);color:#fff;border-color:var(--wine)}button[disabled]{opacity:.53;cursor:default}
main{max-width:1240px;margin:auto;padding:24px}.market{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,1fr);gap:22px}
h1,h2,h3,p{margin:0}h1{font-size:33px;letter-spacing:-.055em}h2{font-size:22px;letter-spacing:-.03em}h3{font-size:16px}.muted,small{color:var(--muted)} .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero{background:#ead9c9 center 51%/cover no-repeat;border-radius:11px;min-height:190px;margin:14px 0}
input[type=search],select{background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0}
.categories{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.card,.pane{background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.photo{aspect-ratio:1.38;display:grid;place-items:center;background:#f3e9df;overflow:hidden}.photo img{display:block;width:100%;height:100%;object-fit:contain;min-height:0}.photo.plain{color:#66535d;font-size:13px;background:#f0e5e6}
.card-body{padding:10px;min-width:0}.card-body h3{overflow-wrap:anywhere}.card-body .row{margin-top:8px}.price{white-space:nowrap}.pane{padding:15px;align-self:start}.pane h2,.pane h3{margin-bottom:8px}
.stack{display:grid;gap:7px;margin:9px 0 16px}.stack:empty:before{content:"장바구니가 비어 있습니다";color:var(--muted)}
.line{border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:7px;padding:8px 0}.line span{overflow-wrap:anywhere}.line small{display:block}.line button{padding:6px 9px}
.box{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0}.intro{margin:8px 0 14px;color:var(--muted)}
.stats-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;min-width:620px}th,td{border-bottom:1px solid var(--line);padding:8px 9px;white-space:nowrap}th{background:var(--tint)}tr.selected td{background:#f7eced}td:last-child{white-space:normal}
.controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.bars{display:grid;gap:10px}.metric{display:grid;grid-template-columns:105px minmax(40px,1fr) 55px;gap:8px;align-items:center}.track{height:10px;background:var(--tint);border-radius:12px}.fill{height:100%;background:var(--wine);border-radius:12px}
footer{max-width:1240px;padding:10px 24px 22px;margin:auto;color:var(--muted);font-size:13px}.status{margin:7px 0;font-size:14px}.action-note{margin-top:8px}
@media(max-width:810px){.market{grid-template-columns:minmax(0,1fr)}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.bar,main{padding:12px 16px}.hero{min-height:139px}}
@media(max-width:500px){.brand{font-size:20px}.bar{flex-wrap:wrap}.nav button{padding:5px 7px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:26px}.market{gap:12px}}
</style>
</head>

<script>
"use strict";
const originalMarkup = "<!doctype html>\n" + document.documentElement.outerHTML;
const payload = JSON.parse(document.getElementById("w13a-data").textContent);
const $ = id => document.getElementById(id);
const items = payload.catalog, basket = new Set();
const names = {popularity:"인기순", "cf-1":"아이템 CF · 1", "cf-3":"아이템 CF · 3", "cf-5":"아이템 CF · 5"};
const headers = ["run_id","model","min_coorders","n_orders","hits_at_5","hit_at_5","ndcg_at_5"];
let selected = payload.selected, category = "", limit = 12;
const price = item => "£"+item.price.toFixed(2);
const displayName = item => payload.media.labels?.[item.sku] || item.name;

function element(name, content, className) {
  const node = document.createElement(name);
  if (content !== undefined) node.textContent = content;
  if (className) node.className = className;
  return node;
}
function button(label, handler, className) {
  const node = element("button", label, className);
  node.type="button"; node.addEventListener("click", handler); return node;
}
function show(which) {
  const catalog = which === "catalog";
  $("catalog-view").hidden = !catalog; $("stats-view").hidden = catalog;
  // A grid display rule would otherwise override the browser's default hidden rule.
  $("catalog-view").style.display = catalog ? "" : "none";
  $("catalog-tab").setAttribute("aria-pressed", String(catalog)); $("stats-tab").setAttribute("aria-pressed", String(!catalog));
  if (!catalog) renderStats();
}
function add(index) {
  basket.add(index); renderBasket(); renderProducts();
}
function remove(index) {
  basket.delete(index); renderBasket(); renderProducts();
}
function picture(item) {
  const src = payload.media.products?.[item.sku];
  const node = element("div", src ? undefined : "이미지 없음", src ? "photo" : "photo plain");
  if (src) {
    const photo = document.createElement("img");
    photo.src = src;
    photo.alt = "";
    node.append(photo);
  }
  return node;
}
function renderProducts() {
  const query = $("search").value.trim().toLocaleLowerCase();
  const priority = [...payload.featured, ...items.map((_,i)=>i).filter(i=>!payload.featured.includes(i))];
  const matches = priority.filter(i => (!category || items[i].category===category) &&
    (displayName(items[i])+" "+items[i].original+" "+items[i].sku).toLocaleLowerCase().includes(query));
  $("product-grid").replaceChildren(...matches.slice(0,limit).map(i => {
    const item=items[i], card=element("article",undefined,"card"), body=element("div",undefined,"card-body");
    const bar=element("div",undefined,"row");
    const addButton=button(basket.has(i)?"담음":"담기",()=>add(i),"primary");
    addButton.disabled=basket.has(i); addButton.setAttribute("aria-label",displayName(item)+" 담기");
    bar.append(element("span",price(item),"price"),addButton); body.append(element("h3",displayName(item)),bar);
    card.dataset.sku=item.sku; card.append(picture(item),body); return card;
  }));
  if(!matches.length) $("product-grid").append(element("p","검색 결과가 없습니다."));
  $("more").hidden = matches.length <= limit;
}
function rank() {
  const scores=Array(items.length).fill(0);
  const minimum=selected==="popularity" ? null : Number(selected.split("-")[1]);
  if(minimum!==null) for(const i of basket) for(const [candidate,co,score] of payload.neighbors[i]) {
    if(co>=minimum) scores[candidate]+=score;
  }
  const order=items.map((_,i)=>i).filter(i=>!basket.has(i)).sort((a,b)=>scores[b]-scores[a] ||
    payload.counts[b]-payload.counts[a] || (items[a].sku < items[b].sku ? -1 : items[a].sku > items[b].sku ? 1 : 0));
  return order.slice(0,5).map(i=>[i,scores[i]]);
}
function renderBasket() {
  $("count").textContent=String(basket.size);
  $("model").value=selected;
  $("basket").replaceChildren(...[...basket].map(i=>{
    const item=items[i], row=element("div",undefined,"line");
    row.dataset.sku=item.sku;
    const b=button("빼기",()=>remove(i)); b.setAttribute("aria-label",displayName(item)+" 빼기");
    row.append(element("span",displayName(item)+" · "+price(item)),b); return row;
  }));
  $("model-note").textContent = !basket.size ? "빈 장바구니에서는 인기 상품을 표시합니다." :
    selected==="popularity" ? "주문에 포함된 횟수로 정렬합니다." : "함께 주문된 근거를 이용하고, 근거가 약한 자리에는 인기 상품을 표시합니다.";
  $("recommendations").replaceChildren(...rank().map(([i,score],position)=>{
    const item=items[i], row=element("div",undefined,"line"); row.dataset.sku=item.sku;
    const label=element("span",String(position+1)+". "+displayName(item));
    label.append(element("small",score>0 ? "동시구매 기반 추천" : "인기 상품"));
    const b=button("담기",()=>add(i)); b.setAttribute("aria-label","추천 "+displayName(item)+" 담기");
    row.append(label,b); return row;
  }));
}
function renderStats() {
  const rows=payload.metrics;
  $("stats-context").textContent = (payload.student_code ? "공통 검증 주문 " : "시연용 주문 표본 ")+rows[0].n_orders+"건";
  $("bars").replaceChildren(...rows.map(row=>{
    const line=element("div",undefined,"metric"), track=element("div",undefined,"track"), fill=element("div",undefined,"fill");
    fill.style.width=(Number(row.hit_at_5)*100)+"%"; track.append(fill);
    line.append(element("span",names[row.run_id]),track,element("span",(Number(row.hit_at_5)*100).toFixed(1)+"%")); return line;
  }));
  $("metrics").querySelector("tbody").replaceChildren(...rows.map(row=>{
    const tr=element("tr",undefined,row.run_id===selected?"selected":""); tr.dataset.runId=row.run_id;
    for(const value of [names[row.run_id],row.min_coorders||"—",row.n_orders,row.hits_at_5,
      Number(row.hit_at_5).toFixed(6),Number(row.ndcg_at_5).toFixed(6)]) tr.append(element("td",String(value)));
    const td=element("td"), radio=element("input"); radio.type="radio"; radio.name="release-model";
    radio.setAttribute("aria-label",names[row.run_id]+" 선택"); radio.checked=row.run_id===selected;
    radio.addEventListener("change",()=>{selected=row.run_id;renderBasket();renderStats();}); td.append(radio); tr.append(td); return tr;
  }));
  $("download-zip").disabled=!payload.student_code;
  $("export-note").textContent=payload.student_code ? "선택한 모델: "+names[selected] : "이 화면은 시연용입니다. 두 코드를 완성한 뒤 본인 프로젝트에서 제출 ZIP을 받을 수 있습니다.";
}
const csv = () => headers.join(",")+"\r\n"+payload.metrics.map(row=>headers.map(key=>row[key]).join(",")).join("\r\n")+"\r\n";
function download(content,name,type){
  const url=URL.createObjectURL(new Blob([content],{type}));
  const link=element("a"); link.href=url; link.download=name; document.body.append(link); link.click(); link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function crc32(bytes){
  let crc=-1;
  for(const byte of bytes){crc^=byte;for(let bit=0;bit<8;bit++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);}
  return (crc^-1)>>>0;
}
function storedZip(entries){
  const encoder=new TextEncoder(), files=[], central=[]; let offset=0, size=0;
  for(const [name,content] of entries){
    const filename=encoder.encode(name), data=encoder.encode(content), checksum=crc32(data);
    const local=new Uint8Array(30+filename.length), l=new DataView(local.buffer);
    l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(12,33,true);l.setUint32(14,checksum,true);l.setUint32(18,data.length,true);l.setUint32(22,data.length,true);l.setUint16(26,filename.length,true);local.set(filename,30);
    const head=new Uint8Array(46+filename.length), h=new DataView(head.buffer);
    h.setUint32(0,0x02014b50,true);h.setUint16(4,20,true);h.setUint16(6,20,true);h.setUint16(14,33,true);h.setUint32(16,checksum,true);h.setUint32(20,data.length,true);h.setUint32(24,data.length,true);h.setUint16(28,filename.length,true);h.setUint32(42,offset,true);head.set(filename,46);
    files.push(local,data);central.push(head);offset+=local.length+data.length;size+=head.length;
  }
  const end=new Uint8Array(22), view=new DataView(end.buffer);
  view.setUint32(0,0x06054b50,true);view.setUint16(8,entries.length,true);view.setUint16(10,entries.length,true);view.setUint32(12,size,true);view.setUint32(16,offset,true);
  return new Blob([...files,...central,end],{type:"application/zip"});
}
function exportSubmission(){
  if(!payload.student_code)return;
  const manifest={schema_version:1,assignment:"2026-2-recommender-w13a-a1",data_version:payload.version,
    dataset_sha256:payload.snapshot,runs:Object.keys(names),selected_run_id:selected};
  const saved={...payload,selected};
  const markup=originalMarkup.replace(/(<script id="w13a-data" type="application\/json">)[\s\S]*?(<\/script>)/,
    (_,start,end)=>start+JSON.stringify(saved).replaceAll("<","\\u003c")+end);
  const zip=storedZip([["submission.json",JSON.stringify(manifest)],["student_model.py",payload.student_code],["metrics.csv",csv()],["shop.html",markup]]);
  download(zip,"w13a-assignment1.zip","application/zip");
}
if(payload.media.hero)$("hero").style.backgroundImage="url("+payload.media.hero+")";
$("model").replaceChildren(...payload.metrics.map(row=>{
  const option=element("option",names[row.run_id]);option.value=row.run_id;return option;
}));
$("catalog-tab").onclick=()=>show("catalog");$("stats-tab").onclick=()=>show("stats");
$("cart-jump").onclick=()=>{show("catalog");$("basket-panel").scrollIntoView({block:"nearest"});};
$("model").onchange=e=>{selected=e.target.value;renderBasket();};
$("search").oninput=()=>{limit=12;renderProducts();};
$("clear-basket").onclick=()=>{basket.clear();renderBasket();renderProducts();};
$("more").onclick=()=>{limit+=12;renderProducts();};
document.querySelectorAll(".category").forEach(button=>button.onclick=()=>{
  category=button.dataset.cat;limit=12;
  document.querySelectorAll(".category").forEach(b=>b.setAttribute("aria-pressed",String(b===button)));
  renderProducts();
});
$("download-csv").onclick=()=>download(csv(),"metrics.csv","text/csv;charset=utf-8");
$("download-zip").onclick=exportSubmission;
renderProducts();renderBasket();show("catalog");
</script>
</body>
</html>
