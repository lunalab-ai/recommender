session: w01a-orientation-and-recommenders
items:
- question: 후보가 매우 많을 때 추천시스템이 필요한 이유는 무엇인가?
  answer: 많은 후보를 모두 살펴보기 어려우므로 관심 가능성이 높은 후보를 먼저 제시해 탐색을 돕는다.
- question: 모든 사용자에게 같은 인기 목록을 보여주는 것은 개인화 추천인가?
  answer: 모든 사용자에게 같은 목록을 보여준다면 개인화 추천이 아니다.
- question: 추천시스템의 네 요소를 쓰시오.
  answer: 사용자, 아이템, 행동과 맥락, 추천 결과다.
- question: 클릭을 곧바로 사용자의 만족이라고 단정하기 어려운 이유는 무엇인가?
  answer: 클릭은 실수, 호기심, 과제 수행 등 여러 원인으로 발생하며 만족을 직접 측정하지 않기 때문이다.
- question: 협업 필터링과 내용 기반 추천은 각각 무엇에서 출발하는가?
  answer: 협업 필터링은 여러 사용자의 행동 패턴, 내용 기반 추천은 아이템 특성과 사용자의 과거 관심에서 출발한다.
- question: 개인화 추천이 항상 비개인화 추천보다 적절하다고 할 수 있는가?
  answer: 아니다. 목적, 사용자 정보의 양, 설명 가능성, 신규 사용자 상황에 따라 비개인화 추천이 적절할 수 있다.
- question: 다음 수업에서 확인할 사용자 행동 데이터의 예를 하나 쓰시오.
  answer: 조회, 클릭, 평점, 구매 등이 사용자 행동 데이터의 예입니다.
