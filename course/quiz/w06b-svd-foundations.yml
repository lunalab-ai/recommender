session: w06b-svd-foundations
items:
- question: $A=\begin{bmatrix}2&1\\0&1\end{bmatrix}$, $x=\begin{bmatrix}1\\2\end{bmatrix}$이다. $A$와 $x$의 크기를 쓰고,
    $Ax$, $A^\top$, $A^\top A$를 구하라. 모든 원소의 곱셈과 덧셈을 보이라.
  answer: '**Q1 · 행렬곱과 전치**


    ### 1. 무엇을 계산하는가?


    행렬의 크기는 **행 수 × 열 수**로 읽는다. $A$는 $2\times2$, $x$는 $2\times1$이다. 안쪽 크기 2가 같으므로 곱할 수 있고, 결과는 바깥쪽 크기인 $2\times1$이다.
    $Ax$는 $A$의 각 행과 $x$의 열을 마주 놓고 같은 위치의 수를 곱해 더한다.


    ### 2. 행렬과 벡터의 곱


    $$

    Ax=\begin{bmatrix}2(1)+1(2)\\0(1)+1(2)\end{bmatrix}

    =\begin{bmatrix}4\\2\end{bmatrix}.

    $$


    첫 행은 첫 출력좌표, 둘째 행은 둘째 출력좌표를 만든다. 입력 화살표는 오른쪽1·위쪽2였고 출력은 오른쪽4·위쪽2가 된다. 두 좌표를 각각 제곱하는 계산이 아니다.


    ### 3. 전치와 행렬곱


    전치는 행과 열을 맞바꾼다. $A$의 첫 행 $(2,1)$이 $A^\top$의 첫 열이 된다.


    $$

    A^\top=\begin{bmatrix}2&0\\1&1\end{bmatrix},\qquad

    A^\top A=\begin{bmatrix}

    2(2)+0(0)&2(1)+0(1)\\

    1(2)+1(0)&1(1)+1(1)

    \end{bmatrix}=\begin{bmatrix}4&2\\2&2\end{bmatrix}.

    $$


    ### 4. 검산과 해석


    비대각 원소가 둘 다2이므로 결과는 대칭이다. 대각원소4와2는 원래 각 열의 제곱합이다. $x^\top A^\top Ax$는 $(Ax)^\top(Ax)=4^2+2^2=20$과 같아야 한다. 실제
    $A^\top Ax=(8,6)^\top$이고 $1(8)+2(6)=20$이다.


    **흔한 오답:** $A^\top A$를 원소별 곱으로 구하면 안 된다. Python에서도 행렬곱은 `@`, 원소별 곱은 `*`이다. 전치는 역행렬을 구하는 연산도 아니다.'
- question: $a=(1,1)^\top$, $b=(1,-1)^\top$의 내적과 길이를 구하라. 각각을 단위벡터로 바꾸고, 두 열로 만든 $V$에 대해 $V^\top V=I$를 확인하라.
  answer: '**Q2 · 벡터 길이·정규화·직교**


    ### 1. 내적은 대응 좌표의 곱을 더한다


    $$a^\top b=1(1)+1(-1)=0.$$


    두 벡터 모두 0벡터가 아니고 내적이0이므로 서로 직교한다. 그림에서는 원점에서 오른쪽 위로 가는 화살표와 오른쪽 아래로 가는 화살표가 직각을 이룬다.


    ### 2. 길이와 단위벡터


    $$\|a\|=\sqrt{1^2+1^2}=\sqrt2,\qquad \|b\|=\sqrt{1^2+(-1)^2}=\sqrt2.$$


    단위벡터는 원래 벡터를 **그 벡터의 길이**로 나눈다.


    $$v_1=\frac1{\sqrt2}\begin{bmatrix}1\\1\end{bmatrix},\qquad v_2=\frac1{\sqrt2}\begin{bmatrix}1\\-1\end{bmatrix}.$$


    예를 들어 $\|v_1\|^2=(1/\sqrt2)^2+(1/\sqrt2)^2=1/2+1/2=1$이다. 길이를2로 착각해 각 좌표를1/2로 만들면 결과의 길이는1이 아니다.


    ### 3. 네 칸의 내적을 계산한다


    $$

    V=\frac1{\sqrt2}\begin{bmatrix}1&1\\1&-1\end{bmatrix},\quad

    V^\top V=\begin{bmatrix}

    1/2+1/2&1/2-1/2\\1/2-1/2&1/2+1/2

    \end{bmatrix}=\begin{bmatrix}1&0\\0&1\end{bmatrix}=I.

    $$


    대각의1은 각 열의 길이가1이라는 뜻이고, 비대각의0은 서로 다른 열이 직교한다는 뜻이다. **직교정규**는 이 두 조건을 함께 말한다. 정규화는 길이를 맞출 뿐, 원래 직교하지 않는 두 벡터를
    자동으로 직교하게 만들지는 않는다.


    **검산:** $VV^\top$도 이 예제에서는 $I$이다. 단, 직사각형 축소 SVD의 $U$에서는 $U^\top U=I$여도 $UU^\top=I$는 아닐 수 있다(Q7).'
- question: $D=\operatorname{diag}(3,-2)$이다. $e_1=(1,0)^\top$, $e_2=(0,1)^\top$가 고유벡터인지 확인하고 고유값을 구하라. $z=(1,1)^\top$도
    고유벡터인가? $D$의 특이값과 고유값은 같은가?
  answer: '**Q3 · 음수 고유값의 뜻**


    ### 1. 먼저 직접 곱한다


    $$De_1=\begin{bmatrix}3\\0\end{bmatrix}=3e_1,\qquad De_2=\begin{bmatrix}0\\-2\end{bmatrix}=-2e_2.$$


    $e_1$은 고유값3의 고유벡터이고, $e_2$는 고유값−2의 고유벡터이다. 첫 방향에서는 길이가3배가 된다. 둘째 방향에서는 길이가2배가 되고 화살표가 반대로 향한다. 같은 **직선** 위에
    있다는 말은 항상 같은 화살표 방향이라는 말과 다르다.


    ### 2. 일반 벡터와 비교한다


    $$Dz=\begin{bmatrix}3\\-2\end{bmatrix}.$$


    $Dz=\lambda z$가 되려면 첫 좌표에서 $\lambda=3$, 둘째 좌표에서 $\lambda=-2$여야 한다. 하나의 배율이 두 값을 동시에 가질 수 없으므로 $z$는 고유벡터가 아니다.
    모든 벡터가 고유벡터가 되는 것은 아니다.


    ### 3. 특이값은 길이의 배율이므로 음수가 아니다


    $$D^\top D=\begin{bmatrix}9&0\\0&4\end{bmatrix}.$$


    이 행렬의 고유값은9와4이고 특이값은 $\sqrt9=3$, $\sqrt4=2$이다. 원래 $D$의 고유값은3과−2이지만 특이값은3과2이다. 방향 반전은 SVD의 직교행렬이 표현한다.


    **검산:** $U=\operatorname{diag}(1,-1)$, $\Sigma=\operatorname{diag}(3,2)$, $V=I$이면 $U\Sigma V^\top=D$이다.


    **흔한 오답:** 특이값에−2를 적지 않는다. 또한 고유벡터는 0벡터일 수 없다. 0벡터는 어떤 배율과도 $D0=\lambda0$를 만족하여 특별한 방향을 알려주지 못한다.'
- question: $B=\begin{bmatrix}2&1\\1&2\end{bmatrix}$에 대해 $\det(B-\lambda I)=0$을 전개하여 고유값을 구하라. 각 고유값의 고유벡터를 연립방정식으로
    구하고 정규화한 뒤 대입 검산하라.
  answer: '**Q4 · 고유값부터 직접 계산하기**


    ### 1. 왜 행렬식을0으로 두는가?


    $Bv=\lambda v$를 한쪽으로 모으면 $(B-\lambda I)v=0$이다. 0이 아닌 $v$가 존재하려면 이 계수행렬이 가역이면 안 된다. $2\times2$에서는 이를 행렬식0으로 찾을
    수 있다. $\begin{bmatrix}a&b\\c&d\end{bmatrix}$의 행렬식은 $ad-bc$이다.


    ### 2. 고유값의 식을 전개한다


    $$

    \det\begin{bmatrix}2-\lambda&1\\1&2-\lambda\end{bmatrix}

    =(2-\lambda)^2-1=\lambda^2-4\lambda+3

    =(\lambda-3)(\lambda-1)=0.

    $$


    따라서 고유값은3과1이다. $\lambda I$를 빼므로 **대각원소에서만** $\lambda$를 뺀다. 모든 칸에서 빼지 않는다.


    ### 3. 고유값3의 벡터


    $$

    (B-3I)v=\begin{bmatrix}-1&1\\1&-1\end{bmatrix}\begin{bmatrix}x\\y\end{bmatrix}=0.

    $$


    두 식은 $-x+y=0$과 $x-y=0$이다. 같은 조건 $y=x$이므로 자유롭게 $x=1$을 고르면 $(1,1)^\top$을 얻는다. 길이 $\sqrt2$로 나누어 $v_1=(1,1)^\top/\sqrt2$로
    정규화한다.


    ### 4. 고유값1의 벡터


    $$

    (B-I)v=\begin{bmatrix}1&1\\1&1\end{bmatrix}\begin{bmatrix}x\\y\end{bmatrix}=0.

    $$


    조건은 $x+y=0$, 즉 $y=-x$이다. $x=1$을 고르면 $(1,-1)^\top$이고 정규화하면 $v_2=(1,-1)^\top/\sqrt2$이다.


    ### 5. 원래 식으로 돌아가 검산한다


    $$Bv_1=\frac1{\sqrt2}\begin{bmatrix}3\\3\end{bmatrix}=3v_1,\qquad

    Bv_2=\frac1{\sqrt2}\begin{bmatrix}1\\-1\end{bmatrix}=v_2.$$


    Q2에서 두 열의 길이와 직교성도 확인했다. $(-1,-1)^\top/\sqrt2$도 고유값3의 정답이다. 벡터의 부호가 답지와 다르다는 이유만으로 틀린 답은 아니다. 부호보다 **대입식·길이·짝의
    대응**을 확인한다.'
- question: $A=\begin{bmatrix}5&1\\1&5\end{bmatrix}$의 SVD를 구하라. $A^\top A$ → 고유값 → 정규 고유벡터 → 특이값 → 왼쪽 특이벡터 → $U\Sigma
    V^\top$ 재구성 순서를 모두 보이라.
  answer: '**Q5 · SVD를 처음부터 끝까지**


    ### 1. 오른쪽 방향을 찾을 행렬


    입력과 출력이 모두2차원이므로 $U,\Sigma,V$는 이 예제에서 모두 $2\times2$이다. 오른쪽 특이벡터는 $A^\top A$의 고유벡터로 구한다. $A$가 대칭이라 $A^\top=A$지만,
    이 성질이 모든 행렬에 적용되는 것은 아니다.


    $$A^\top A=\begin{bmatrix}

    5(5)+1(1)&5(1)+1(5)\\1(5)+5(1)&1(1)+5(5)

    \end{bmatrix}=\begin{bmatrix}26&10\\10&26\end{bmatrix}.$$


    ### 2. 고유값의 모든 전개


    $$

    \det(A^\top A-\lambda I)=(26-\lambda)^2-100

    =\lambda^2-52\lambda+576=(\lambda-36)(\lambda-16)=0.

    $$


    따라서 $\lambda_1=36$, $\lambda_2=16$이다. $36+16=52$는 대각합 $26+26$과 같고, $36(16)=576$은 행렬식 $26^2-10^2$와 같아 계산을 점검할
    수 있다.


    ### 3. 정규 고유벡터를 열로 놓는다


    $\lambda_1=36$이면 $-10x+10y=0$, 즉 $y=x$이다. $\lambda_2=16$이면 $10x+10y=0$, 즉 $y=-x$이다. 각각 $(1,1)^\top$과 $(1,-1)^\top$을
    고른 뒤 길이 $\sqrt2$로 나눈다.


    $$v_1=\frac1{\sqrt2}\begin{bmatrix}1\\1\end{bmatrix},\quad

    v_2=\frac1{\sqrt2}\begin{bmatrix}1\\-1\end{bmatrix},\quad

    V=\frac1{\sqrt2}\begin{bmatrix}1&1\\1&-1\end{bmatrix}.$$


    ### 4. 특이값은 고유값의 제곱근


    $$\sigma_1=\sqrt{36}=6,\qquad\sigma_2=\sqrt{16}=4,\qquad

    \Sigma=\begin{bmatrix}6&0\\0&4\end{bmatrix}.$$


    36과16을 그대로 $\Sigma$에 넣지 않는다. 길이의 제곱배율을 길이의 배율로 바꾸므로 제곱근이 필요하다. 큰 특이값부터 배열하고 벡터의 순서도 함께 맞춘다.


    ### 5. 왼쪽 특이벡터 계산


    $Av_j=\sigma_j u_j$이므로 **양의 특이값에 한해** $u_j=Av_j/\sigma_j$이다.


    $$Av_1=\frac1{\sqrt2}\begin{bmatrix}5+1\\1+5\end{bmatrix}

    =\frac1{\sqrt2}\begin{bmatrix}6\\6\end{bmatrix},\quad

    u_1=\frac{Av_1}{6}=\frac1{\sqrt2}\begin{bmatrix}1\\1\end{bmatrix}.$$


    $$Av_2=\frac1{\sqrt2}\begin{bmatrix}5-1\\1-5\end{bmatrix}

    =\frac1{\sqrt2}\begin{bmatrix}4\\-4\end{bmatrix},\quad

    u_2=\frac{Av_2}{4}=\frac1{\sqrt2}\begin{bmatrix}1\\-1\end{bmatrix}.$$


    따라서 이 예제에서는 $U=V$이다. 이는 이 대칭 양의 정부호 예제의 성질이며 일반 SVD에서 $U=V$라고 가정하면 안 된다.


    ### 6. 원래 행렬을 복원해 최종 확인


    $$

    U\Sigma=\frac1{\sqrt2}\begin{bmatrix}6&4\\6&-4\end{bmatrix},\quad

    U\Sigma V^\top=\frac12\begin{bmatrix}6+4&6-4\\6-4&6+4\end{bmatrix}

    =\begin{bmatrix}5&1\\1&5\end{bmatrix}=A.

    $$


    두 번 등장한 $1/\sqrt2$가 곱해져 $1/2$가 된다. $U^\top U=I$, $V^\top V=I$, 특이값이6·4로 내림차순이라는 조건도 만족한다.


    **해석:** 입력의 두 직교방향을 각각6배,4배 늘려 출력 방향으로 보내면 원래 행렬의 작용을 재현한다. 컴퓨터가 −부호를 가진 벡터를 돌려줘도 대응하는 $u_j,v_j$의 부호가 함께 바뀌면
    외적은 같고 정답이다.'
- question: Q5의 첫 특이값 항만 남긴 $A_1$을 구하라. $A-A_1$, Frobenius 오차, 원소당 RMSE, 제곱합 보존 비율을 계산하고 각각의 의미를 설명하라.
  answer: '**Q6 · rank-1 근사와 버린 패턴**


    ### 1. 한 항은 열벡터와 행벡터의 외적


    $$A_1=\sigma_1u_1v_1^\top

    =6\left(\frac1{\sqrt2}\begin{bmatrix}1\\1\end{bmatrix}\right)

    \left(\frac1{\sqrt2}\begin{bmatrix}1&1\end{bmatrix}\right)

    =3\begin{bmatrix}1&1\\1&1\end{bmatrix}.$$


    내적은 수 하나를 만들지만, 여기의 **외적**은 $2\times2$ 패턴을 만든다. 두 열이 같아 독립적인 열 방향이 하나뿐이므로 rank는1이다. rank가1이라고 행렬에 숫자 하나만 남는
    것은 아니다.


    ### 2. 버린 패턴 확인


    $$A-A_1=\begin{bmatrix}2&-2\\-2&2\end{bmatrix}

    =4u_2v_2^\top.$$


    첫 패턴은 모든 칸에 공통된3을 표현하고 둘째 패턴은 대각에+2, 비대각에−2를 더한다. 두 패턴을 더하면 원본으로 돌아간다. 잠재축을 자동으로 특정 영화 장르라고 부를 근거는 없다.


    ### 3. 서로 다른 오차 정의


    $$\|A-A_1\|_F=\sqrt{2^2+(-2)^2+(-2)^2+2^2}=\sqrt{16}=4.$$


    Frobenius 노름은 모든 원소의 제곱오차를 **합한 뒤** 제곱근을 취한다. 원소당 RMSE라면 원소 수4로 먼저 나누므로 $\sqrt{16/4}=2$이다. 두 값을 혼용하지 않는다.


    ### 4. 보존 비율과 검산


    $$\frac{\sigma_1^2}{\sigma_1^2+\sigma_2^2}=\frac{36}{52}=\frac9{13}\approx69.23\%.$$


    원본 제곱합은 $25+1+1+25=52$, 근사의 제곱합은 $9+9+9+9=36$, 차이의 제곱합은16이다. $52=36+16$으로 다시 확인한다. 버린 특이값이4이므로 오차 제곱은 $4^2=16$과
    같다.


    **해석의 한계:** 69.23%는 이 완전 행렬의 제곱합을 얼마나 남겼는지이다. 추천 정확도69.23%나 학생 만족도라는 뜻이 아니다. 또한 rank를 높이면 완전 행렬의 재구성 오차는 줄지만
    보류 평점의 성능 향상은 보장되지 않는다.'
- question: $C=\begin{bmatrix}3&0\\0&2\\0&0\end{bmatrix}$에 대해 축소 SVD의 각 크기와 인수를 구하라. $U^\top U$와 $UU^\top$를 비교하고
    rank-1 근사 오차를 구하라.
  answer: '**Q7 · 직사각형 행렬과 축소 SVD**


    ### 1. 크기부터 확인


    $C$는 $3\times2$, $q=\min(3,2)=2$이다. 축소 SVD에서 $U$는 $3\times2$, $\Sigma$는 $2\times2$, $V^\top$는 $2\times2$이다.
    곱의 크기는 $(3\times2)(2\times2)(2\times2)=3\times2$로 맞는다.


    ### 2. 오른쪽 방향과 특이값


    $$C^\top C=\begin{bmatrix}9&0\\0&4\end{bmatrix}.$$


    고유값9·4에 대응하는 단위 고유벡터는 $e_1,e_2$이다. 따라서 $V=I_2$, 특이값은3·2이다. $Ce_1/3=(1,0,0)^\top$, $Ce_2/2=(0,1,0)^\top$이다.


    $$U=\begin{bmatrix}1&0\\0&1\\0&0\end{bmatrix},\quad

    \Sigma=\begin{bmatrix}3&0\\0&2\end{bmatrix},\quad V^\top=I_2.$$


    ### 3. 곱으로 확인


    $U\Sigma$의 첫 열은 $(3,0,0)^\top$, 둘째 열은 $(0,2,0)^\top$이다. $I_2$를 곱해도 바뀌지 않으므로 원본 $C$가 된다.


    $$U^\top U=I_2,\qquad UU^\top=\begin{bmatrix}1&0&0\\0&1&0\\0&0&0\end{bmatrix}\ne I_3.$$


    $U$의 열들은 서로 직교정규이지만3차원의 모든 방향을 채우지는 않는다. 이것이 축소 SVD에서 전치와 역행렬을 무조건 같은 뜻으로 쓰면 안 되는 이유이다.


    ### 4. 절단은 축소와 다르다


    축소 SVD는 이 예제의 두 특이값을 모두 남겨 **정확히** 복원했다. rank-1 절단은 둘째 항을 버린다.


    $$C_1=\begin{bmatrix}3&0\\0&0\\0&0\end{bmatrix},\qquad

    \|C-C_1\|_F=\sqrt{2^2}=2.$$


    **추가 확인:** 완전 SVD를 쓰면 $U$는 $3\times3$, $\Sigma$는 $3\times2$이다. 세 번째 왼쪽 열을 $(0,0,1)^\top$로 추가하고 $\Sigma$의 마지막
    행을0으로 두면 같은 $C$가 나온다. NumPy의 `s`는 행렬이 아닌 길이2의 배열이다.'
- question: $E=\begin{bmatrix}3&0\\4&0\end{bmatrix}$의 특이값을 구하라. 0으로 나누지 않고 compact SVD와 한 가지 완전 SVD를 제시하고 재구성하라.
  answer: '**Q8 · 0 특이값과 rank 부족**


    ### 1. 특이값 구하기


    $$E^\top E=\begin{bmatrix}3^2+4^2&0\\0&0\end{bmatrix}

    =\begin{bmatrix}25&0\\0&0\end{bmatrix}.$$


    고유값은25와0이고 특이값은5와0이다. 비영 특이값이 하나이므로 rank는1이다. 영벡터인 둘째 열은 새로운 열 방향을 제공하지 않는다.


    ### 2. 양의 특이값에만 나눗셈 적용


    $$v_1=\begin{bmatrix}1\\0\end{bmatrix},\quad

    Ev_1=\begin{bmatrix}3\\4\end{bmatrix},\quad

    u_1=\frac15\begin{bmatrix}3\\4\end{bmatrix}.$$


    $\|u_1\|^2=9/25+16/25=1$이다. $v_2=(0,1)^\top$를 곱하면 $Ev_2=0$이다. 여기서 $Ev_2/0$을 계산하면 $0/0$이 되어 정의되지 않는다.


    ### 3. compact SVD로 충분히 복원


    0인 항은 곱에 기여하지 않으므로 양의 특이값에 해당하는 한 열만 사용해도 된다.


    $$E=\begin{bmatrix}3/5\\4/5\end{bmatrix}[5]\begin{bmatrix}1&0\end{bmatrix}

    =\begin{bmatrix}3&0\\4&0\end{bmatrix}.$$


    compact 크기는 $(2\times1)(1\times1)(1\times2)$이다. 근사가 아니라 이 rank-1 행렬의 정확한 표현이다.


    ### 4. 완전 SVD를 원한다면 직교 방향을 보충


    $$u_2=\begin{bmatrix}-4/5\\3/5\end{bmatrix},\quad

    U=\begin{bmatrix}3/5&-4/5\\4/5&3/5\end{bmatrix},\quad

    \Sigma=\begin{bmatrix}5&0\\0&0\end{bmatrix},\quad V=I_2.$$


    $u_1^\top u_2=-12/25+12/25=0$, $\|u_2\|^2=16/25+9/25=1$이다. $U\Sigma$의 둘째 열은0이므로 보충 방향을 달리 정해도 원본 재구성에 영향을 주지
    않는다.


    **검산과 오답:** $E_1=E$이므로 Frobenius 오차는0이다. 컴퓨터의 약 $10^{-15}$ 수준 차이는 부동소수점 계산에서 나올 수 있다. `error == 0`만 요구하지 않고
    허용오차로 비교한다. ‘두 열이 있으니 rank=2’ 또는 ‘0 특이값도 나누면 된다’는 답은 잘못이다.'
- question: 설명용 정답 행렬 $R=\begin{bmatrix}5&1\\1&5\end{bmatrix}$에서 첫 행 둘째 열을 감춘다. 그 자리에0을 넣은 $M$을 rank-2 SVD로 완전히
    재구성하면 해당 칸의 예측은 얼마인가? 입력 $M$에 대한 오차와 감춘 한 칸의 실제 오차를 계산하고 비교하라.
  answer: '**Q9 · 재구성과 추천은 같은가?**


    ### 1. 알고 있는 정답과 모델에 준 입력을 분리


    $$R=\begin{bmatrix}5&1\\1&5\end{bmatrix},\qquad

    M=\begin{bmatrix}5&0\\1&5\end{bmatrix}.$$


    원래1인 칸을 실험을 위해 감췄다. 실전에서는 원래 미관측인 칸의 정답을 알 수 없지만, 이 예제에서는 차이를 검산하기 위해 알고 있던 값을 보류했다. 0은 관측된 평점이 아니라 우리가 임의로
    넣은 값이다.


    ### 2. 완전한 재구성의 대상은 입력 M


    $\det(M)=25\ne0$이므로 rank는2이다. 두 특이값을 모두 사용하는 정확한 SVD는 $M_2=M$을 복원한다. 숫자 SVD 전체를 다시 손으로 풀지 않아도 재구성의 정의로 결과를 알
    수 있다.


    $$\widehat R_{12}=(M_2)_{12}=0,\qquad\|M-M_2\|_F=0.$$


    ‘오차0’은 우리가 제공한 0을 포함한 **입력 행렬**을 정확히 복원했다는 의미이다.


    ### 3. 감춘 정답으로 채점


    실제 보류값은1인데 예측은0이므로 잔차는 $1-0=1$, 절대오차는1, 제곱오차는1이다. 보류 칸이 하나이므로 그 한 칸의 RMSE도 $\sqrt{1/1}=1$이다. 원래 $R$ 전체와 비교해도
    다른 세 칸은 같고 이 한 칸만 다르므로 Frobenius 오차는1이다.


    ### 4. 추천 MF와 연결


    관측집합 $\Omega$에만 맞추는 MF는 감춘 칸을 손실에 넣지 않는다. 반면 위 SVD는 그 칸의0도 재구성 대상으로 사용했다. 따라서 문제의 차이는 단순히 인수 행렬의 개수가 아니다. **어느
    칸을 어떤 값으로 맞추는지**가 다르다.


    이 작은 예제로 MF의 예측이 반드시1이라고 주장할 수는 없다. 학습 자료·정규화·초기화 등에 따라 달라지며 별도 보류 평가가 필요하다. 또한 절단 SVD에서는 대입한0이 반드시0으로 남는 것도
    아니다. 이 반례는 **모든 항을 남긴 정확한 재구성**을 조건으로 한다.


    **마지막 문장:** 입력 재구성 오차가0이어도 미관측 평점 예측 오차는0이 아닐 수 있다.'
