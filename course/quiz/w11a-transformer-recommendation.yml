session: w11a-transformer-recommendation
items:
- question: 7장의 평점 복원과 8장의 다음 아이템 예측은 입력·정답·손실이 어떻게 다른가요?
  answer: 7장은 평점 벡터를 입력해 각 위치의 평점을 복원하고 관측 MSE/RMSE로 평가합니다. 8장은 시간순 내부 ID 접두 이력에서
    다음 아이템 ID를 분류하며 CE로 학습하고 추천 목록은 P/R/F1로 평가합니다.
- question: 중심화된 관측값이 0일 때도 손실에 포함해야 하는 이유는 무엇인가요?
  answer: 평점이 훈련 평균과 같으면 실제 관측도 중심화 뒤0입니다. 값의0 여부가 아니라 원래 관측 마스크로 손실 항과 분모를 정해야 합니다.
- question: Q가 3×2, K가 3×2, V가 3×2이면 attention 가중치와 출력의 크기는 각각 무엇인가요?
  answer: QK 전치의 크기는3×3이고 softmax도 같은 크기입니다. 이를3×2의 V에 곱하면 출력은3×2입니다.
- question: attention 가중치의 한 행 합이 1인 이유와 V에 곱하는 이유는 무엇인가요?
  answer: 유효 위치의 지수값을 그 행의 합으로 나누므로 합이1입니다. 가중치로 V의 정보들을 섞어 query별 새 표현을 만듭니다. 주어진
    수치에서 attention은 가중 평균이며 가장 큰 아이템 하나를 선택하는 연산과 다릅니다.
- question: 패딩 마스크와 인과 마스크는 무엇을 다르게 가리나요?
  answer: 패딩 마스크는 실제 아이템이 없는 위치를, 인과 마스크는 각 query보다 뒤인 위치를 가립니다. 교재처럼 과거 접두 전체로 다음
    하나를 분류하는 설정과 시점마다 다음 항목을 예측하는 설정을 구분합니다.
- question: 정답 아이템 확률이 .5일 때 교차엔트로피는 얼마이며, 학습은 무엇을 바꾸나요?
  answer: $-\log(.5)=\log2\approx.693147$입니다. 학습은 현재 모수의 손실 기울기를 구해 가중치와 optimizer
    상태를 바꿉니다. 순전파만 실행하면 이 갱신은 없습니다.
- question: 반복 추천에서 원본 ID와 내부 ID, 실제 다음 정답은 각각 어디에 사용하나요?
  answer: 모형의 반복 입력에는 내부 ID만 추가하고 표시할 때 원본 ID와 제목으로 복원합니다. 실제 다음 정답은 학습 쌍의 라벨이나 보류
    평가에 사용하며, 반복 생성 입력에 대신 넣지 않습니다.
- question: 추천 7개 중 정답 10개와 겹치는 아이템이 2개일 때 P/R/F1을 구하고 평가 의미를 설명하세요.
  answer: $P=2/7\approx.285714$, $R=2/10=.2$, $F1=4/17\approx.235294$입니다. 생성7개와 보류10개의
    집합 적중 비율이며 각 위치의 순서 정확도가 아닙니다. 사용자별 지표를 같은 비중으로 평균합니다.
