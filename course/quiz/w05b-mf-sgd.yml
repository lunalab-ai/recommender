session: w05b-mf-sgd
items:
- question: MF에서 P와 Q는 각각 무엇을 나타내며, 사용자 943명·영화 1682편·K=8일 때 모양은 무엇인가?
  answer: P는 사용자 잠재벡터를 행으로 모은 (943,8), Q는 영화 잠재벡터를 행으로 모은 (1682,8)이다. Q의 전치와 곱하면 (943,1682)
    예측 행렬이다.
- question: 미관측 칸을 0점으로 채워 학습 손실에 포함하면 왜 문제가 되는가?
  answer: 미관측은 평점이 알려지지 않았다는 뜻이다. 0으로 손실에 넣으면 사용자가 싫어했다는 가짜 정답이 되어 예측을 아래로 끌어내린다.
    관측쌍 집합에 대해서만 손실을 계산한다.
- question: p=(0.2,0.4), q=(0.5,-0.1)의 내적은 얼마이며, 음수 항은 무엇을 뜻하는가?
  answer: 0.2×0.5+0.4×(-0.1)=0.06이다. 둘째 항 -0.04는 그 잠재요인의 예측 기여가 음수라는 뜻이며 실제 장르 이름이나
    부정적 성격을 뜻하지 않는다.
- question: 실제 평점 4, 예측 2.96일 때 잔차와 1/2 제곱손실은 얼마인가?
  answer: 잔차는 4-2.96=1.04점, 제곱손실의 절반은 0.5408이다. 정규화 항을 더한 목적함수와 구분한다.
- question: 양의 잔차일 때 잠재벡터의 모든 좌표를 늘려야 하는가? 이유를 설명하라.
  answer: 아니다. p의 갱신은 상대 벡터 q의 부호와 정규화에 달려 있다. 예제에서 q2=-0.1이므로 p2는 0.4에서 0.3944로 감소한다.
- question: SGD 한 단계와 한 epoch의 차이는 무엇이며, 18관측·30 epoch의 갱신 수는 얼마인가?
  answer: 한 단계는 한 관측에 관련된 모수의 갱신, 한 epoch는 모든 학습 관측을 한 번 방문하는 것이다. 18×30=540회이며 epoch
    0은 갱신 전 기록이다.
- question: P와 Q를 모두 0으로 초기화하면 상호작용 학습에 어떤 문제가 생기는가?
  answer: 상호작용의 기울기에 상대 벡터가 곱해지므로 둘 다 0이면 계속 0이다. 편향은 바뀔 수 있지만 요인 상호작용은 학습되지 않는다.
- question: 학습 RMSE 감소만으로 새 데이터의 추천 품질이 좋아졌다고 말할 수 없는 이유는 무엇인가?
  answer: 학습 관측을 잘 설명하는 것과 보지 못한 관측을 맞히는 것은 다르다. 별도의 평가 자료, 동일 후보와 관련성 조건의 순위 평가가
    필요하다. 이번 범위는 교재 4.1–4.3의 학습 원리다.
