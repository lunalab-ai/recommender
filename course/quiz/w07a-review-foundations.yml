session: w07a-review-foundations
items:
- question: SVD에서 AᵀA의 고유값이36이면 특이값은 얼마이며 왜 제곱근을 취하나요?
  answer: 6이다. 단위 입력 방향의 출력 길이 제곱이36이므로 길이 배율은√36=6이다.
- question: 대표 예제의 rank-1에서 오차제곱합16과 Frobenius오차는 어떻게 연결되나요?
  answer: Frobenius오차는 원소별 오차제곱합의 제곱근이므로√16=4이다. 원소당RMSE는4칸으로 나누어√(16/4)=2이다.
- question: 축소 SVD는 언제나 근사라는 말이 맞나요?
  answer: 아니다. 축소 SVD는 q=min(m,n)의 항을 사용하며 원본을 정확히 복원한다. 비영 항을 버리는 절단을 할 때 일반적으로 근사가
    된다.
- question: 좌우 특이벡터의 부호가 답지와 다르면 무엇으로 검산하나요?
  answer: 같은 항의 u와v가 동시에 반전되면 외적은 같다. 직교성, 특이값, UΣVᵀ 재구성으로 검산한다.
- question: 미관측에0을 넣고 완전히 재구성하면 숨긴 평점도 정확히 맞힌 것인가요?
  answer: 아니다. 입력된0을 정확히 복원한 것이다. 별도로 감춘 실제 평점과 비교해야 예측 오차를 알 수 있다.
