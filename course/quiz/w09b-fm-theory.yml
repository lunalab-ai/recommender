session: w09b-fm-theory
items:
- question: FM에서 입력 차원 n과 잠재 차원 k는 각각 무엇을 세나요?
  answer: $n$은 입력 특성 열 수이고 $k$는 각 특성 잠재벡터의 길이입니다. $k$가 증가해도 이 모델의 상호작용 차수는 2입니다.
- question: 2-way FM에서 i<j 조건은 어떤 두 종류의 중복을 막나요?
  answer: i=j인 자기항을 제외하고 (i,j)와 (j,i)의 역순 중복을 한 번만 셉니다.
- question: 선형항과 상호작용항은 각각 무엇을 나타내나요?
  answer: 선형항은 각 특성 혼자의 기여를, 상호작용항은 특성 두 개의 결합 기여를 나타냅니다. 입력값의 곱도 함께 반영합니다.
- question: 사용자와 아이템 원핫만 활성인 FM을 편향이 있는 MF와 연결하려면 어떤 조건이 필요한가요?
  answer: 사용자·아이템 원핫 각각 하나만 활성이고 부가 특성이 없거나 0이며, 사용자·아이템 편향 및 잠재벡터를 대응시키면 편향 MF와 같습니다.
- question: 잠재벡터 공유는 관측되지 않은 조합의 예측에 어떻게 도움을 주며, 새 ID와는 어떻게 다른가요?
  answer: 동일 특성의 벡터가 여러 관측과 쌍에 재사용되어 이미 정의된 특성의 새로운 조합 계수를 만들 수 있습니다. 미정의 새 ID에는 벡터나
    처리 전략이 더 필요합니다.
- question: 효율식에서 자기항을 빼고 2로 나누는 이유는 무엇인가요?
  answer: 합의 제곱에 포함된 자기 곱을 제곱합으로 제거합니다. 그 후 남는 역순 쌍이 두 개씩이므로 2로 나눕니다.
- question: 연속 입력을 허용할 때 자기항에서 입력값을 제곱해야 하는 이유는 무엇인가요?
  answer: 제곱하는 대상은 $v_{if}x_i$ 전체이므로 자기항도 $v_{if}^{2}x_i^{2}$입니다. 일반 연속값은 $x_i^{2}=x_i$가
    성립하지 않습니다.
- question: e=y−예측일 때 제곱손실의 경사하강 갱신식에 양의 αe 항이 나타나는 이유는 무엇인가요?
  answer: 손실의 예측 미분이 $-e$이며 경사하강에서 손실 미분을 다시 빼기 때문입니다. 잔차 정의를 바꾸면 부호를 함께 바꿔야 합니다.
- question: 한 관측의 모든 잠재벡터 갱신에서 같은 이전 상태를 사용해야 하는 이유는 무엇인가요?
  answer: 동일한 손실 함수의 현재 지점에서 구한 한 단계 기울기를 적용하기 위해서입니다. 먼저 바뀐 벡터를 뒤의 미분에 쓰면 다른 갱신 규칙이
    됩니다.
- question: 희소 표현의 입력 0, 평점의 미관측, 0기반 인덱스를 어떻게 구별하나요?
  answer: 희소 입력에서 생략한 0은 해당 특성값입니다. 정답의 미관측은 따로 관리하며 y를 x에 넣지 않습니다. 교재의 1기반 열 번호와
    Python의 0기반 위치도 명시적으로 변환합니다.
