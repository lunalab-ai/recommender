session: w03b-cf-step-by-step
items:
- question: 원본 평점표와 코사인 계산용 0 채움 표를 별도로 유지해야 하는 이유는 무엇인가?
  answer: 원본의 빈칸은 미관측이며 실제 0점이 아니다. 계산용 표는 동일 영화 축의 벡터 내적을 위한 표현이다. 평균·평가 정답·관측 여부에는
    원본의 관측 마스크를 사용한다. U1의 관측 평균은 3점이지 0 채움 평균 1.8점이 아니다.
- question: U1–U2의 전체 차원 코사인에서 두 번째 노름에 D와 E 평점도 포함되는 이유는 무엇인가?
  answer: 분자는 대응 항목의 곱이므로 공통 A·B·C만 남지만 각 벡터의 길이는 각자의 전체 관측으로 계산한다. U2의 제곱합은 50이다.
    공통 항목만 남기면 제곱합이 21로 바뀌며, 이는 다른 코사인 정의다.
- question: U1의 D와 E 예측에서 평가자 집합과 가중평균 분모가 달라지는 이유는 무엇인가?
  answer: D에는 U2·U3·U4가 기여하지만 E에는 U4의 관측이 없으므로 U2·U3만 기여한다. 자기 자신, 목표 영화 미평가자, 0 이하
    유사도는 제외한다. 분자와 분모에 같은 집합을 사용한다.
- question: predict_details의 weight_sum과 explain의 weight 합은 각각 무엇인가?
  answer: weight_sum은 적격 평가자들의 정규화 전 유사도 합이다. explain의 weight는 그 합으로 나눈 정규화 가중치이므로
    근거가 있으면 합이 1이다. U1–D에서 전자는 약 1.869380이고 후자는 1이다.
- question: 학습에 없던 사용자에게 숫자 예측이 반환되면 개인화 근거가 충분하다고 볼 수 있는가?
  answer: 아니다. basis가 movie-mean 또는 global-mean이면 학습 평균 대체다. CF 기여자 수와 근거 표를 함께 확인한다.
    유사도·평균은 train에서만 계산해야 하며 test 정답으로 보강해서는 안 된다.
