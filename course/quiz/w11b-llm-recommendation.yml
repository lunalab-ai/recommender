session: w11b-llm-recommendation
items:
- question: 프롬프팅에 예시를 추가하는 것과 LLM 미세조정은 어떤 차이가 있나요?
  answer: 프롬프팅은 입력 문맥을 바꾸며 이번 호출은 LLM 가중치를 갱신하지 않습니다. 미세조정은 학습 쌍의 손실과 기울기로 LLM 모수를
    갱신합니다.
- question: 이번 CF와 CB 프롬프트는 각각 어떤 근거를 읽나요?
  answer: CF는 예시 사용자들의 관측 제품 이력과 대상의 과거 이력을 읽습니다. CB는 예시 사용자에서 집계한 후보 제품 리뷰와 대상의 관측
    평점 상위3개 리뷰를 읽습니다. 대상 마지막3개는 평가 전용입니다.
- question: 후보 A/B/C, K=3에서 유효 추천 A/B, 보류 정답 A/C이면 P@3과 recall은 얼마인가요?
  answer: 적중1개이므로 P@3=1/3, recall=1/2, F1=.4입니다. 유효 목록이2개여도 요청한 K=3을 precision 분모로
    유지합니다. 후보에 없는 정답을 강제로 추가하지 않습니다.
- question: 벡터 (3,4)와 (4,3)의 코사인을 계산하고 그 의미를 설명하세요.
  answer: 두 길이는5, 내적은24이므로 코사인24/25=.96입니다. 방향의 유사도이며 추천 확률이나 예측 평점이 아닙니다. 합성 벡터로
    계산한 예입니다.
- question: 사용자2명·제품3개·양쪽 임베딩 d=1·FM K=2일 때 x와 V의 크기는 무엇인가요?
  answer: x의 길이는2+3+2×1=7, V는7×2입니다. d는 리뷰 표현의 선택 차원이며 K는 각 입력 특성의 FM 상호작용 잠재요인 수입니다.
- question: FM에서 편향3·선형항 .4·상호작용1.2이면 예측과 y=4의 반제곱오차는 얼마인가요?
  answer: 예측은4.6, error=y−예측=−.6, 손실0.5×.6²=.18입니다. w/V를 갱신하기 전의 수치이며 예측을 확률로 해석하지
    않습니다.
- question: 왜 리뷰 임베딩을 만든 뒤에 훈련·시험을 나누면 안 되나요?
  answer: 검증/시험 관측의 텍스트가 사용자·제품 표현에 미리 섞일 수 있기 때문입니다. 먼저 분할하고 평균·리뷰 집계·벡터·ID사전을 train에서만
    만듭니다. validation은 최적 상태 선택, test는 선택 후 평가에만 사용합니다.
- question: 캐시를 재사용한 실행과 임베딩+FM의 성능 향상을 각각 어떻게 확인해야 하나요?
  answer: 캐시 사용 여부와 새 encoder 요청 수를 확인합니다. 텍스트·모델·분할·d·함수 변경은 키를 바꿉니다. 성능은 같은 분할의
    전체 오차와 미관측 건수를 비교하며 임베딩 추가가 항상 개선을 보장하지 않습니다.
