session: w07b-cf-foundations
items:
- question: 그림 1에서 u1의 미관측 영화 열을 추가하면 관측 평균이 바뀌나요?
  answer: 변하지 않습니다. 새 관측이 없어서 평균의 분자와 관측 분모가 같습니다.
- question: 그림 2에서 벡터의 양의 배율과 코사인은 어떤 관계인가요?
  answer: 양의 배율은 분자와 길이곱에 같은 비율로 반영되어 상쇄됩니다. 두 비영벡터의 방향은 유지됩니다.
- question: 그림 5의 정규화 비중 합과 기여도 합은 각각 무엇인가요?
  answer: 정규화 비중의 합은1, 기여도의 합은 설명 예제의 예측3.5입니다.
- question: 그림 7의 0.2는 별점 예측인가요, 보정량인가요?
  answer: 보정량입니다. 대상 평균3을 더하면 예측3.2가 됩니다.
- question: 그림 9에서 validation과 test를 구분하는 이유는 무엇인가요?
  answer: validation은 설정 선택, test는 설정을 확정한 뒤 최종 평가에 사용합니다. test를 보며 고르면 독립 최종 평가가
    아닙니다.
