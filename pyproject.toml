[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-recommender-course"
version = "0.1.0"
description = "Reusable teaching code for Dongduk Women's University recommender-systems course"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "nbformat>=5.10",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "markdown-it-py>=3,<5",
  "playwright>=1.50,<2",
  "pypdf>=5,<7",
  "ruff>=0.9",
  "pre-commit>=4.0",
  "jupytext>=1.16",
  "nbclient>=0.10",
  "ipykernel>=6.29"
]
apps = [
  "gradio>=5.0,<7"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
